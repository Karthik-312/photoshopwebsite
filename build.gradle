plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
    id 'jacoco'
}

// Build React frontend before processResources
// Run "cd frontend && npm run build" manually if Gradle build fails (npm not in PATH)
def frontendDir = file('frontend')
tasks.register('buildFrontend', Exec) {
    workingDir frontendDir
    commandLine System.getProperty('os.name').toLowerCase().contains('windows') ? ['cmd', '/c', 'npm', 'run', 'build'] : ['npm', 'run', 'build']
    onlyIf { frontendDir.exists() && file('frontend/package.json').exists() }
    ignoreExitValue = false
}
tasks.named('processResources') {
    dependsOn buildFrontend
}

// Build outside OneDrive to avoid file-lock issues on Windows
buildDir = file("${System.getProperty('user.home')}/.gradle/builds/${rootProject.name}")

group = 'com.spandana'
version = '1.0.0'

java {
    sourceCompatibility = '17'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'com.h2database:h2'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
        html.outputLocation = layout.projectDirectory.dir("reports/jacoco")
    }
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.0  // Optional: raise later (e.g. 0.80 for 80%)
            }
        }
    }
}
