# Server
server.port=8080

# H2 Database (file-based - data persists across restarts)
# Stored outside OneDrive to avoid file-locking issues
spring.datasource.url=jdbc:h2:file:${user.home}/.spandana-db/photohouse;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (optional - for debugging)
# spring.h2.console.enabled=true
# Access at http://localhost:8080/h2-console

# Admin API - change in production
app.admin.password=admin123

# ── Email Notification (Gmail SMTP) ──
# 1. Go to https://myaccount.google.com/apppasswords
# 2. Generate an App Password for "Mail"
# 3. Paste it below (no spaces)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=dvr.spandana@gmail.com
spring.mail.password=YOUR_APP_PASSWORD_HERE
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

# Studio details for notifications
app.studio.email=dvr.spandana@gmail.com
app.studio.phone=8121046903
app.studio.name=Spandana Photo House

# ── SMS via Fast2SMS (free tier for India) ──
# Sign up at https://www.fast2sms.com and get API key
app.sms.enabled=false
app.sms.api-key=YOUR_FAST2SMS_API_KEY

# ── Google Reviews (Places API) ──
# Get API key from https://console.cloud.google.com (enable Places API)
# Find Place ID at https://developers.google.com/maps/documentation/places/web-service/place-id
app.google.places.api-key=
app.google.places.place-id=

# ── Razorpay Payment Gateway ──
# Sign up at https://razorpay.com, get keys from Dashboard > Settings > API Keys
# Use test keys for development (start with rzp_test_)
app.razorpay.key-id=
app.razorpay.key-secret=
app.razorpay.advance-amount=1000
